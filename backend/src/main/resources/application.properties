# Enable local development explicitly with SPRING_PROFILES_ACTIVE=local.
spring.application.name=backend
server.forward-headers-strategy=NONE
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

# Chat WebSocket (STOMP)
app.chat.websocket.endpoint=/ws/chat

# SMTP
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

auth.email-verification.mail-from=${MAIL_FROM:${SMTP_USERNAME:}}
auth.email-verification.code-expiration-seconds=${EMAIL_CODE_EXPIRATION_SECONDS:300}
auth.email-verification.resend-interval-seconds=${EMAIL_RESEND_INTERVAL_SECONDS:60}

# Shared MySQL auth protection. Every instance must use the same settings/schema.
auth.protection.trusted-proxies=${AUTH_TRUSTED_PROXIES:}
auth.protection.login-requests.email-max=${AUTH_LOGIN_EMAIL_REQUESTS:20}
auth.protection.login-requests.ip-max=${AUTH_LOGIN_IP_REQUESTS:120}
auth.protection.login-requests.window-seconds=${AUTH_LOGIN_REQUEST_WINDOW_SECONDS:60}
auth.protection.login-failures.email-max=${AUTH_LOGIN_EMAIL_FAILURES:10}
auth.protection.login-failures.ip-max=${AUTH_LOGIN_IP_FAILURES:30}
auth.protection.login-failures.window-seconds=${AUTH_LOGIN_FAILURE_WINDOW_SECONDS:600}
auth.protection.login-failures.block-seconds=${AUTH_LOGIN_BLOCK_SECONDS:60}
auth.protection.verify-requests.email-max=${AUTH_VERIFY_EMAIL_REQUESTS:10}
auth.protection.verify-requests.ip-max=${AUTH_VERIFY_IP_REQUESTS:60}
auth.protection.verify-requests.window-seconds=${AUTH_VERIFY_REQUEST_WINDOW_SECONDS:60}
auth.protection.verify-failures.email-max=${AUTH_VERIFY_EMAIL_FAILURES:5}
auth.protection.verify-failures.ip-max=${AUTH_VERIFY_IP_FAILURES:20}
auth.protection.verify-failures.window-seconds=${AUTH_VERIFY_FAILURE_WINDOW_SECONDS:300}
auth.protection.verify-failures.block-seconds=${AUTH_VERIFY_BLOCK_SECONDS:300}
auth.protection.reset-requests.email-max=${AUTH_RESET_EMAIL_REQUESTS:5}
auth.protection.reset-requests.ip-max=${AUTH_RESET_IP_REQUESTS:20}
auth.protection.reset-requests.window-seconds=${AUTH_RESET_REQUEST_WINDOW_SECONDS:3600}
auth.protection.reset-cooldown-seconds=${AUTH_RESET_COOLDOWN_SECONDS:60}
auth.protection.send-requests.email-max=${AUTH_SEND_EMAIL_REQUESTS:5}
auth.protection.send-requests.ip-max=${AUTH_SEND_IP_REQUESTS:20}
auth.protection.send-requests.window-seconds=${AUTH_SEND_REQUEST_WINDOW_SECONDS:3600}
auth.protection.mail-max=${AUTH_MAIL_MAX:100}
auth.protection.mail-window-seconds=${AUTH_MAIL_WINDOW_SECONDS:3600}

# MySQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# AI
ai.api-key=${AI_API_KEY}
ai.base-url=${AI_BASE_URL}
ai.model=${AI_MODEL}

# Reference data is initialized automatically only by the explicit local profile.
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data-common.sql
spring.sql.init.encoding=UTF-8

spring.jackson.time-zone=Asia/Seoul

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}

# Seed Mode
app.seed.mode=${APP_SEED_MODE:NONE}

# Calendar
app.calendar.crawl-on-startup=${CALENDAR_CRAWL_ON_STARTUP:false}
